        title: "Fiordos del este"
        summary: "Recorrido por los fiordos del este hasta Egilsstaðir, con parada en Seyðisfjörður y sus cascadas de acceso."
        # Night outside any campsite. The note is the author's to write.
        overnight: null
        overnight_note: ""
        # duraciones estimadas, pendiente de confirmar
        stops:
          - place_id: breiddalsvik
            order: 1
            duration_min: 45
            planning_status: optional
            visit_status: visited
          - place_id: stodvarfjordur
            order: 2
            duration_min: 15
            planning_status: optional
            visit_status: visited
          - place_id: reydarfjordur
            order: 3
            duration_min: 40
            planning_status: optional
            visit_status: visited
          - place_id: fardagafoss
            order: 4
            duration_min: 70
            planning_status: optional
            visit_status: visited
          - place_id: gufufoss
            order: 5
            duration_min: 15
            planning_status: optional
            visit_status: visited
          - place_id: seydisfjordur
            order: 6
            duration_min: 60
            planning_status: required
            visit_status: visited
          - place_id: borgarfjardarhofn
            order: 7
