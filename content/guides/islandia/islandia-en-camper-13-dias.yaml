          - place_id: myvatn_viewpoint
            order: 5
            duration_min: 20
            planning_status: optional
            visit_status: visited
            variant_note: "Un spot bonito para disfrutar del lago con tranquilidad y hacer buenas fotos."
          - place_id: leirhnjukur
            order: 6
            duration_min: 45
            planning_status: optional
            visit_status: not_visited
          - place_id: skutustadagigar
            order: 7
            duration_min: 30
            planning_status: optional
            visit_status: not_visited
          - place_id: jardgangalaug
            order: 8
            duration_min: 40
            planning_status: optional
            visit_status: visited
            variant_note: "Nos bañamos junto a la cascada, donde el agua está más fresca que río arriba pero aun así calentita — estábamos a 0°C fuera y el contraste fue único. Solo se bañó uno de nosotros. Lo hicimos justo antes de dormir, de camino al camping Systragil."
        our_take: "Hverir huele mal por el azufre pero es de los paisajes más marcianos del viaje. Merece la pena aunque sea rápido."

