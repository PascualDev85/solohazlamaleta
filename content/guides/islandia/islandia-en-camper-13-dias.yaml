        our_take: "Dormir justo al lado y volver a primera hora es la diferencia entre ver la cascada en foto de postal o entre autobuses de turistas."

      - day: 4
        title: "Trekking en el glaciar"
        summary: "Día centrado en el trekking guiado sobre el glaciar Svínafellsjökull, con Svartifoss de propina antes de instalarse en el camping. Duraciones de las paradas estimadas, no confirmadas — pendientes de ajustar al escribir la guía editorial."
