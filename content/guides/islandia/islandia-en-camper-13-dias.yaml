      - day: 13
        title: "Regreso a Reikiavik"
        summary: "Última etapa de la Ring Road, cierre del círculo en la capital."
        # duración estimada, pendiente de confirmar
        stops:
          - place_id: glymur
            order: 1
            duration_min: 150
            planning_status: optional
            visit_status: not_visited
            skip_reason: "La subida a Glymur es una excursión de 2 a 3 horas ida y vuelta. Es una de las cascadas más altas de Islandia, pero el último día, con el vuelo de vuelta cerca y el camper que entregar, no quisimos arriesgarnos a ir con prisa. Si tienes la mañana libre y buen tiempo, merece la pena; si es tu día de cierre, mejor dejarla."
          - place_id: reykjavik
            order: 2
            duration_min: 90
            planning_status: required
            visit_status: visited
        our_take: "Después de este día no hicimos nada más: nos levantamos más tarde para descansar y fuimos directos a entregar la camper y dejarla limpia."

accommodation:
  notes: "En camper, el alojamiento son campings. Se elige según la posición al final de cada jornada."
  zones:
    - name: "Sur de Islandia"
      description: "Campings más completos y mejor infraestructura."
      pros: ["Duchas incluidas en muchos", "Bien ubicados cerca de los atractivos"]
      cons: ["Más llenos en temporada alta"]
      best_for: [couple, friends]
      picks:
        - name: "Camping Þingvellir"
          price_level: bajo
          notes: "Baño y ducha incluidos. 4.400 ISK para 2 personas y camper sin electricidad en 2025."
          verified_at: 2025-09-15
        - name: "Camping Árnes"
          price_level: bajo
          notes: "El peor camping del viaje: amplio y sencillo pero sucio (ropa interior tirada en el suelo), sin electricidad ni sala común. Dos duchas de agua caliente sin límite de tiempo, una averiada. Los baños (2 de mujeres, 2 de hombres) eran lo mejor, limpios. 4.400 ISK para 2 personas y camper sin electricidad en 2025."
          verified_at: 2025-09-15
        - name: "Camping Skógafoss"
          price_level: bajo
          notes: "4.000 ISK para 2 personas y camper sin electricidad en 2025. Baños gratis; duchas de pago, 400 ISK (unos 5 minutos). Encontramos los baños y las duchas recién limpios al llegar y pudimos ducharnos los dos a la vez."
          verified_at: 2025-09-15
        - name: "Camping Svínafelli (Skaftafell)"
          price_level: bajo
          notes: "Camping muy amplio y completo: 4 duchas interiores y 2 exteriores de agua caliente sin límite de tiempo, 4 baños, sala común amplia con muchas mesas, 4 fuegos para cocinar, utensilios, 3 fregaderos y nevera. Lavandería aparte (lavadora y secadora), 1.800 ISK — el día que fuimos estaba rota. 5.000 ISK para 2 personas y camper sin electricidad en 2025. Lo recomendamos sin dudarlo."
          verified_at: 2025-09-15
        - name: "Skaftafell Campground"
          price_level: medio
          notes: "Camping muy concurrido junto al centro de visitantes del Parque Nacional de Vatnajökull, con salida directa a las rutas al glaciar y a Svartifoss. 8 duchas interiores de agua caliente sin límite de tiempo, 2 baños (4 WC en el de mujeres, 3 en el de hombres), sin sala común, 4 fregaderos de agua caliente exteriores pero cubiertos. Lavandería incluida en el precio; si no llevas detergente, se vende en el centro de visitantes (bolsita, 350 ISK). 5.500 ISK para 2 personas y camper sin electricidad en 2025 — de los más caros del viaje, pero merece la pena por la ubicación. Muy concurrido: conviene llegar temprano, pueden faltar baños y duchas para la cantidad de gente."
          verified_at: 2025-09-15
    - name: "Norte de Islandia"
      description: "Campings más pequeños y tranquilos."
      pros: ["Menos gente", "Más baratos"]
      cons: ["Duchas no siempre incluidas"]
      best_for: [couple, friends]
      picks:
        - name: "Laugar Camping"
          price_level: bajo
          notes: "Alternativa que usamos cuando el Camping Mývatn estaba cerrado. Amplio y con servicios completos: 4 duchas interiores de agua caliente sin límite de tiempo en un vestuario compartido (uno para hombres, otro para mujeres), 4 baños más 1 dentro del vestuario, sala común amplia con muchas mesas y sofá, una vitrocerámica, utensilios, un fregadero, tostadora, hervidores y nevera. 4.800 ISK para 2 personas y camper sin electricidad en 2025 — por el precio, merece muchísimo la pena, es como un polideportivo bien adaptado. Si llueve, cuidado dónde aparcas la camper por el barro. Por la noche viene una persona a cobrar. Lo recomendamos sin dudarlo."
          verified_at: 2025-09-15
        - name: "Systragil Camping Ground"
          price_level: bajo
          notes: "Camping amplio para la camper, enclavado justo en la montaña: pequeño pero precioso, adaptado para familias. Servicios: 2 duchas exteriores de agua caliente sin límite de tiempo, 2 baños, sala común pequeña (para 6 personas), 2 fuegos para cocinar, utensilios básicos, 2 fregaderos de agua caliente exteriores pero cubiertos. Lavandería aparte (lavadora y secadora), 1.000 ISK. 4.200 ISK para 2 personas y camper sin electricidad en 2025 — por el precio, merece muchísimo la pena. Nos nevó por la noche y nos despertamos con todo blanco, fue mágico. Lo recomendamos sin dudarlo."
          verified_at: 2025-09-15
        - name: "Camping Lambeyri"
          price_level: bajo
          notes: "Camping muy amplio y con servicios completos: 4 duchas (en la zona de la piscina) de agua caliente sin límite de tiempo, 4 baños, 2 salas comunes completas con vitrocerámica, utensilios, fregadero, horno y tostadora. Tiene una piscina pequeña con agua caliente (no la usamos) y lavandería. 5.500 ISK para 2 personas y camper sin electricidad en 2025 — por el precio, merece muchísimo la pena. Enclavado junto a un río, tranquilo y mágico: de los mejores campings de todo el viaje. Lo recomendamos sin dudarlo."
          verified_at: 2025-09-15
    - name: "Snæfellsnes (oeste)"
      description: "Campings sencillos al cierre de la ruta, junto a los puntos clave de la península."
      pros: ["Bien situados para Kirkjufell y los acantilados del sur de la península"]
      cons: ["Oferta más limitada que en el sur"]
      best_for: [couple, friends]
      picks:
        - name: "Hellissandur Camping"
          price_level: bajo
          notes: "Camping amplio con servicios: 2 duchas interiores de agua caliente sin límite de tiempo (2 de hombres, 2 de mujeres), 2 baños (2 de hombres, 2 de mujeres), sala común pequeña pero completa, 2 fregaderos cubiertos con agua caliente. 4.000 ISK para 2 personas y camper sin electricidad en 2025, de los más baratos del viaje. Enclavado justo en un campo de lava. Muy concurrido, con gente empezando y terminando la ruta de Snæfellsjökull — conviene ir temprano. Por la noche viene un guardia a cobrar. Lo recomendamos sin dudarlo."
          verified_at: 2025-09-15
        - name: "Mosskógar"
          price_level: bajo
          notes: "Camping amplio y muy cuco: 4 duchas de agua caliente sin límite de tiempo, 4 baños, 4 fregaderos cubiertos con agua caliente (solo 2 de ellos; los otros 2 son solo para rellenar agua). Sala común muy cuidada, en un invernadero, con 2 fuegos para cocinar y utensilios. Tiene un sistema estupendo: productos que deja la gente que termina su viaje, disponibles para quien lo empieza. 5.000 ISK para 2 personas y camper sin electricidad — el único camping del viaje que solo acepta efectivo, hay que llevar coronas encima. John, el dueño, muy amable y risueño; todo organizado por parcelas. Por su precio y lo que ofrece, lo recomendamos sin dudarlo."
          verified_at: 2025-09-15

transport:
  arrival:
    - from_airport: MAD
      description: "Vuelo a Reikiavik (KEF). El camper se recoge en el aeropuerto o en la ciudad. El aeropuerto está a 50 km de Reikiavik."
      notes: "Llegamos a la 1:30 de la madrugada, recogimos la camper y dormimos directamente en un parking entre los supermercados Bonus y Kronan, en Reikiavik (63.97318428783835, -22.5445651829879)."
      verified_at: 2025-09-11
  local:
    - mode: "Camper"
      description: "Ring Road (Ruta 1) rodea toda la isla, asfaltada. Velocidad máx. 90 km/h en carretera, 30 km/h en pistas de grava. F-roads (pistas del interior): prohibidas para campers estándar."
      notes: "App Gas Map Iceland para encontrar gasolineras baratas. Llenar siempre al pasar por una ciudad."
      verified_at: 2025-09-15

booking_checklist:
  - label: "Alquiler del camper"
    when: "3-6 meses antes"
    priority: alta
    notes: "Los buenos campers se agotan meses antes del verano."
  - label: "Trekking en el glaciar"
    when: "1-2 meses antes"
    priority: alta
    notes: "Las plazas se agotan en temporada alta. Es la excursión más cara del viaje y la más impresionante — no dejarla para el último momento."
  - label: "Seguro de viaje"
    when: "Antes de salir"
    priority: media

our_criteria:
  - "El trekking en el glaciar (502 € entre los dos) es lo más caro y lo más impresionante. No lo recortaríamos."
  - "Cocinar en el camper es lo que hace viable el presupuesto. Comer fuera en Islandia puede ser 3-4 veces más caro que en España."
  - "Las F-roads están prohibidas para campers estándar. No intentarlo aunque parezca transitable."
  - "Si tuviéramos que quitar algo, empezaríamos por las paradas que no dieron tiempo en el plan original."

pitfalls:
  - "No entrar en F-roads: el GPS de la empresa lo detecta y la penalización puede ser mayor que el deducible del seguro."
  - "Llenar gasolina siempre al pasar por una ciudad. Los tramos remotos pueden tener 150 km sin gasolinera."
  - "Las puertas del camper pueden dañarse con el viento. Posicionar siempre el vehículo como escudo antes de abrir."
  - "En septiembre nos nevó varias noches y llegamos a estar a 0 °C: los campings sin ducha caliente ni sala común se hacen muy duros con ese frío."
  - "Si la nevera de la camper funciona con la batería del vehículo sin estar enchufada a electricidad, apagarla por la noche: dejarla encendida puede agotar la batería y dejar la camper sin arrancar a la mañana siguiente."
  - "La calefacción del habitáculo delantero puede averiarse; si pasa en pleno temporal de nieve o lluvia, puede dejarte mojado y sin calor de golpe. Llevar ropa de abrigo de repuesto a mano."
  - "Casi todo en Islandia se paga con tarjeta, pero algún camping aislado puede pedir solo efectivo. Llevar algunas coronas encima por si acaso."

terrain_tips:
  - "App Vedur (tiempo oficial islandés): el tiempo cambia en minutos."
  - "App Gas Map Iceland para gasolineras más baratas."
  - "Diamond Beach y Jökulsárlón están separadas por la Ring Road: son dos sitios distintos, cruzar con cuidado."
  - "Gljúfrafoss está a 500 metros de Seljalandsfoss, poca gente llega."

practical:
  documents:
    - "DNI o pasaporte (Islandia es espacio Schengen)"
    - "Carnet de conducir (el español es válido)"
    - "Tarjeta de crédito con margen para fianza del camper (puede ser 1.000-2.000 €)"
  plugs: "Tipo F (igual que España). Sin adaptador."
  apps:
    - "Vedur (tiempo oficial)"
    - "Gas Map Iceland (gasolineras baratas)"
    - "Maps.me (offline: imprescindible sin cobertura)"
    - "Safe Travel Iceland (alertas de seguridad vial)"
  tips:
    - "Se puede rellenar la botella de agua gratis en casi cualquier parking, gasolinera o restaurante — el agua del grifo es potable en toda Islandia."

faq:
  - q: "¿Cuánto cuesta viajar a Islandia en camper 13 días?"
    a: "Depende del año y de los precios, así que el total y el precio por persona exactos están en la sección de presupuesto de esta guía, con el desglose completo: vuelos, camper, gasolina, campings, excursiones, supermercado y seguro. Son datos reales de nuestro viaje de 2025, en pareja."
    schema: true
  - q: "¿Qué ruta es mejor, horaria o antihoraria?"
    a: "Nosotros hicimos la antihoraria (sur primero) y nos gustó: el sur tiene los atractivos más impactantes como aperitivo. El norte tiene menos turistas para el final."
    schema: true
  - q: "¿Hace falta 4x4 para la Ring Road?"
    a: "No. La Ring Road está asfaltada y se hace sin problema con un camper estándar. El 4x4 solo es necesario para las F-roads, prohibidas para campers de alquiler estándar."
    schema: true

adaptation_notes:
  - id: parents_road_conditions
    conditions:
      group_type: [parents]
    text: "Para viajar con personas mayores en camper por Islandia conviene reducir los días más largos de conducción (el norte tiene etapas de 300-400 km) partiéndolos en dos. Los campings con mejor infraestructura (duchas, aseos) son especialmente importantes."
    target: both
    priority: 1
  - id: budget_ajustado_camper
    conditions:
      budget: [ajustado]
    text: "Para reducir el presupuesto: cocinar en el camper casi siempre (ahorro estimado 40-70 €/persona), comprar exclusivamente en Bonus, elegir campings sin ducha cuando no sea imprescindible."
    target: both
    priority: 1
