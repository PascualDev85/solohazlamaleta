variants:
  - id: intensivo
    name: "Ruta completa (como la hicimos)"
    description: "Los 13 días tal como los planificamos. Días de hasta 340 km con muchas paradas. Hay que madrugar."
    days:
      - day: 1
        title: "Llegada y Reikiavik"
        summary: "Primer contacto con la isla: un paseo por Reikiavik y la primera cascada del viaje."
        photo:
          src: islandia/islandia-reikiavik-skolavordustigur.jpg
          alt: "Calle Skólavörðustígur en Reikiavik, con el suelo pintado de arcoíris y la iglesia Hallgrímskirkja al fondo"
          caption: "Reikiavik, septiembre de 2025"
        highlight: "Nuestra primera cascada del viaje, donde paramos a comer y disfrutar del lugar."
        # Parking de Bonus y Krónan → Reikiavik (45 km) → Þórufoss (35) → Camping Þingvellir (12). Confirmado por el autor.
        drive:
          km: 90
          minutes: 90
        overnight: camp_thingvellir
        stops:
          - place_id: reykjavik
            order: 1
            duration_min: 300
            duration_max_min: 360
            planning_status: required
            visit_status: visited
            variant_note: "La capital de Islandia, punto de partida y cierre de nuestra ruta, donde aprovechamos para dar un primer paseo antes de comenzar el recorrido por la Ring Road."
          - place_id: thorufoss
            order: 2
            duration_min: 30
            planning_status: optional
            visit_status: visited
            variant_note: "Comimos en este entorno — fue la primera cascada del viaje y flipamos con el paisaje."
        our_take: "Llegamos a la 1:30 de la madrugada y dormimos pocas horas en un parking de la ciudad antes de arrancar el día. Aun con poco sueño, mereció la pena hacer Reikiavik con calma este primer día en vez de dejarlo para el regreso. Aparcamos gratis en el parking de Perlan y recorrimos después la ciudad andando, dándonos una paliza: no lo repetiríamos. Aparcaríamos en alguna de las calles donde se puede o en un parking de pago del centro."

      - day: 2
        title: "Círculo Dorado"
        summary: "El trío clásico para entrar en calor y un río termal para cerrar el día."
        photo:
          src: islandia/islandia-gullfoss.jpg
          alt: "Cascada de Gullfoss en dos saltos, con nubes oscuras y gente en el mirador de la izquierda"
          caption: "Gullfoss, septiembre de 2025"
        highlight: "Acabar en el río termal de Reykjadalur, dándonos un baño y relajándonos en su entorno."
        # Þingvellir → Geysir (60 km) → Gullfoss (10) → Reykjadalur (81) → Camping Árnes (≈ 60).
        drive:
          km: 215
          minutes: 180
        overnight: camp_arnes
        physical_level:
          hills: some
        stops:
          - place_id: thingvellir
            order: 1
            duration_min: 120
            duration_max_min: 180
            planning_status: required
            visit_status: visited
            start_time: "09:00"
            travel_to_next_min: 50
            travel_to_next_mode: "coche"
            variant_note: "Parking P1, paseo por la grieta y el lago, sin perder tiempo."
          - place_id: geysir
            order: 2
            duration_min: 60
            planning_status: required
            visit_status: visited
            start_time: "11:50"
            travel_to_next_min: 10
            travel_to_next_mode: "coche"
          - place_id: gullfoss
            order: 3
            duration_min: 60
            planning_status: required
            visit_status: visited
            start_time: "13:00"
            travel_to_next_min: 65
            travel_to_next_mode: "coche"
          - place_id: reykjadalur
            order: 4
            duration_min: 180
            duration_max_min: 240
            planning_status: optional
            visit_status: visited
            variant_note: "Dicen que la subida son hasta 1h30, pero a nosotros nos costó unos 45 minutos. Nos bañamos entre 1 y 1h30 en un tramo que sentimos casi como una piscina para nosotros solos — la sensación fue increíble. Lo único malo: al salir del agua pasamos mucho frío mientras nos vestíamos."
        our_take: "Si tuviéramos que quitar algo del Círculo Dorado, quitaríamos Þingvellir el primer día y lo dejaríamos para el último, con más calma. El Géiser y Gullfoss son más impactantes como primera impresión. Cambiamos Kerið por subir a Reykjadalur a bañarnos en el río termal al final del día: no nos arrepentimos, mereció la pena el cambio."
        plan_b: "Si llueve: Gullfoss desde el mirador cubierto sigue mereciendo. El Géiser no depende del tiempo."

      - day: 3
        title: "Cascadas del sur"
        summary: "De Þjórsárdalur a la costa sur, entre cascadas y cañones, hasta Skógafoss."
        photo:
          src: islandia/islandia-gljufrafoss-garganta.jpg
          alt: "Cascada de Gljúfrafoss cayendo desde lo alto de una garganta de paredes cubiertas de musgo, con una persona agachada sobre una roca a sus pies"
          caption: "Gljúfrafoss, septiembre de 2025"
        overnight: camp_skogafoss
        highlight: "Entrar en el cañón de Nauthúsagil y llegar hasta su cascada secreta fue uno de los momentos más especiales del día."
        # Camping Árnes → Hjálparfoss (22 km, 30 min) → Háifoss por la pista (12, 1 h) → vuelta por la
        # misma pista, con un intento fallido por el interior, y carretera hasta Nauthúsagil (≈ 85, 2 h) →
        # DC-3 (15 min) → Seljalandsfoss → Gljúfrafoss (30 min) → Camping Skógafoss (30, 30 min).
        # Tiempos confirmados por el autor (2026-10-07).
        drive:
          km: 175
          minutes: 285
        stops:
          - place_id: hjalparfoss
            order: 1
            duration_min: 30
            planning_status: optional
            visit_status: visited
            travel_to_next_min: 60
            travel_to_next_mode: "coche"
          - place_id: haifoss
            order: 2
            duration_min: 45
            duration_max_min: 150
            duration_note: "con la ruta hasta la base de la cascada"
            planning_status: optional
            visit_status: visited
            travel_to_next_min: 120
            travel_to_next_mode: "coche"
            variant_note: "La vimos desde el mirador y no bajamos hasta la base: la ruta nos habría dejado sin tiempo para el resto del día. Llegar al parking ya cuesta: una pista de grava muy irregular en la que, con una camper sin 4x4, tardamos entre 45 minutos y una hora yendo con cuidado. Para salir, el GPS nos mandaba por el interior y tuvimos que dar la vuelta y bajar por la misma pista."
          - place_id: nauthusagil
            order: 3
            duration_min: 90
            planning_status: required
            visit_status: visited
            travel_to_next_min: 15
            travel_to_next_mode: "coche"
            variant_note: "Recorrimos el cañón hasta la cascada escondida dentro de la montaña. Fue lo mejor del día."
          - place_id: dc3_eyvindarholt
            order: 4
            duration_min: 20
            duration_max_min: 30
            planning_status: optional
            visit_status: visited
            travel_to_next_min: 20
            travel_to_next_mode: "coche"
          - place_id: seljalandsfoss
            order: 5
            duration_min: 45
            planning_status: required
            visit_status: visited
            travel_to_next_min: 10
            travel_to_next_mode: "a pie"
          - place_id: gljufrafoss
            order: 6
            duration_min: 30
            planning_status: required
            visit_status: visited
            travel_to_next_min: 30
            travel_to_next_mode: "coche"
          # Left out for lack of time after the Háifoss detour (the author, 2026-10-07).
          - place_id: keldur
            order: 7
            duration_min: 45
            planning_status: optional
            visit_status: not_visited
            skip_reason: "Estaba en el plan, pero el desvío a Hjálparfoss y Háifoss se comió el tiempo que le tocaba. Si repitiéramos el día sin esas dos cascadas, Keldur entraría."
          - place_id: gluggafoss
            order: 8
            duration_min: 30
            planning_status: optional
            visit_status: not_visited
            skip_reason: "Queda de paso en la carretera 261, cerca de Nauthúsagil, pero llegamos sin tiempo. Es una de las paradas que haríamos a cambio de Háifoss."
          - place_id: seljavallalaug
            order: 9
            duration_min: 60
            planning_status: optional
            visit_status: not_visited
            skip_reason: "Entre el camino a pie y el baño son más de una hora, y ese día ya no la teníamos. Si se deja fuera el desvío a Háifoss, cabe antes de dormir en Skógafoss."
        our_take: "Desviarse de la ruta del sur para ver Hjálparfoss y Háifoss solo tiene sentido con buen tiempo y sin lluvia: la pista hasta el parking de Háifoss es irregular, con una camper sin 4x4 hay que ir con cuidado y se pierde mucho tiempo en el acceso. Si solo se van a ver las dos cascadas, sin hacer la ruta hasta la base, quizá no merezca tanto la pena. Nosotros las cambiaríamos por lo que dejamos fuera ese día por falta de tiempo: Keldur, Gluggafoss y la piscina de Seljavallalaug. Seljalandsfoss se puede hacer con calma por la mañana. Dormir junto a Skógafoss deja la cascada lista para volver temprano, con luz y sin gente."
        plan_b: "La lluvia mejora estas cascadas (más caudal). No es mal plan si llueve."

      - day: 4
        title: "Mañana tranquila en Skógafoss"
        summary: "Vuelta a Skógafoss por la mañana, sin las multitudes del mediodía, para subir al mirador con calma."
        overnight: camp_svinafell
        physical_level:
          hills: some
        stops:
          - place_id: skogafoss
            order: 1
            duration_min: 60
            planning_status: required
            visit_status: visited
            start_time: "08:30"
            variant_note: "Subir las escaleras de la derecha para el mirador superior. Con la luz de la mañana y sin las multitudes del mediodía."
        our_take: "Dormir justo al lado y volver a primera hora es la diferencia entre ver la cascada en foto de postal o entre autobuses de turistas."

      - day: 5
        title: "Trekking en el glaciar"
        summary: "Día centrado en el trekking guiado sobre el glaciar Svínafellsjökull, con Svartifoss de propina antes de instalarse en el camping."
        overnight: camp_skaftafell
        # duraciones estimadas, pendiente de confirmar
        stops:
          - place_id: trekking_glaciar_svinafellsjokull
            order: 1
            duration_min: 360
            planning_status: required
            visit_status: visited
            variant_note: "Excursión de 6 horas y dificultad moderada, con la base de operaciones muy bien situada, tranquila y rodeada de naturaleza, cerca del parque de Skaftafell. No nos tocó un día espectacular de tiempo, pero la experiencia de caminar sobre el glaciar fue impresionante igualmente. Por el precio, merece muchísimo la pena."
          - place_id: hundafoss
            order: 2
            duration_min: 10
            planning_status: optional
            visit_status: visited
          - place_id: svartifoss
            order: 3
            duration_min: 90
            planning_status: required
            visit_status: visited
          - place_id: svinafellsjokull
            order: 4
            duration_min: 20
            planning_status: optional
            visit_status: not_visited
            variant_note: "Se ve desde el aparcamiento sin necesidad de hacer la excursión guiada. Queda fuera del itinerario si el trekking ocupa toda la tarde."
            skip_reason: "Ese mismo día habíamos hecho el trekking guiado sobre el glaciar, así que acercarnos al mirador de Svínafellsjökull habría sido repetir paisaje. Si no haces una excursión de glaciar, este mirador es una forma fácil y gratuita de ver una lengua glaciar de cerca; para nosotros, después del trekking, sobraba."
        our_take: "El trekking en el glaciar es la excursión más cara del viaje (502 € entre los dos) y la más impresionante. No la recortaríamos."

      - day: 6
        title: "Jökulsárlón, Diamond Beach y Vestrahorn"
        summary: "De Skaftafell a Djúpivogur, con parada en las dos lagunas glaciares y los paisajes del sureste."
        # Night outside any campsite. The note is the author's to write.
        overnight: null
        overnight_note: ""
        # duraciones estimadas, pendiente de confirmar
        stops:
          - place_id: mulagljufur
            order: 1
            duration_min: 110
            planning_status: optional
            visit_status: visited
            variant_note: "Una de las joyas de Islandia: pudimos disfrutar de todo el recorrido y de los miradores, en plena naturaleza. Nos encantó. Desde el parking al mirador son unos 45 minutos de ida y otros 45 de vuelta."
          - place_id: fjallsarlon
            order: 2
            duration_min: 45
            planning_status: required
            visit_status: visited
          - place_id: jokulsarlon
            order: 3
            duration_min: 90
            planning_status: required
            visit_status: visited
            variant_note: "Diamond Beach es espectacular: llena de trozos de icebergs grandes y pequeños que parecen diamantes. Desde Jökulsárlón salen excursiones en barca para ver de cerca cómo caen los icebergs al mar — no las hicimos, pero es un espectáculo a la vez precioso y un poco triste de ver desde la orilla."
          - place_id: vestrahorn
            order: 4
            duration_min: 60
            planning_status: required
            visit_status: visited
            variant_note: "Para nosotros sí mereció la pena pagar por verlo: el recorrido es bastante amplio y el entorno, con las montañas y el poblado vikingo, es espectacular. Comimos en las mesas cerca del parking y pudimos usar también la zona de baño del camping."
          - place_id: eystrahorn
            order: 5
            duration_min: 30
            planning_status: optional
            visit_status: visited
          - place_id: thjodvegur_renos
            order: 6
            duration_min: 15
            planning_status: optional
            visit_status: not_visited
            variant_note: "Tramo donde suele haber renos, sin garantía de avistamiento."
          - place_id: laekjavik
            order: 7
            duration_min: 20
            planning_status: optional
            visit_status: not_visited
          - place_id: djupavogskorin
            order: 8
            duration_min: 15
            planning_status: optional
            visit_status: not_visited
          - place_id: raudafell
            order: 9
            duration_min: 90
            planning_status: optional
            visit_status: visited
            variant_note: "Después de muchos kilómetros paramos aquí y empezamos a ver auroras boreales: de las mejores del viaje, de montaña a montaña y con todos los colores. Fue tan épico que nos quedamos a dormir en el mirador, y queremos ser claros: en Islandia está prohibido pernoctar en camper fuera de los campings y hay multas. No lo recomendamos. Si las auroras te pillan en ruta, disfrútalas y sigue después hasta el camping más cercano. Quedarse solo es legal con permiso del propietario del terreno, y en ese caso, con respeto absoluto por el entorno y bajo la responsabilidad de cada uno."
        our_take: "Diamond Beach y Jökulsárlón son dos sitios distintos separados por la Ring Road: cruzar con cuidado entre ambos. No vimos ningún reno en el tramo donde suelen estar — no lo contaríamos como parada en sí, es solo un tramo de carretera con posibilidad de avistamiento."

