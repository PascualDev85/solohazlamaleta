            visit_status: not_visited
            skip_reason: "Buscábamos ver frailecillos y no era la época: no había ninguno cuando pasamos. Si vas en temporada de avistamiento, sí merece la pena acercarse."
          - place_id: vok_baths
            order: 8
            duration_min: 90
            planning_status: optional
            visit_status: visited
            variant_note: "Nos encantaron estos baños: el entorno donde están es precioso. No fuimos a otros para comparar, pero esto solo ya mereció la pena. Nos tomamos una cerveza dentro del agua y un té al salir."
          - place_id: vestdalsfossar
            order: 9
            duration_min: 60
            planning_status: optional
            visit_status: not_visited
        food:
          - name: "Askur Pizzeria (Egilsstaðir)"
            area: Egilsstaðir
            price_level: medio
            notes: "2 pizzas y un refresco de 2L, unos 7.200 ISK (unos 50 €) para 2 personas en 2025. Pizzas espectaculares."
            verified_at: 2025-09-17
        our_take: "Seyðisfjörður con la calle arcoíris merece parar aunque no se vaya a coger el ferry."

      - day: 8
        title: "Cañones y cascadas del este"
        summary: "De Egilsstaðir hacia Mývatn, con los grandes cañones y cascadas del norte-este como protagonistas."
        overnight: camp_laugar
        # duraciones estimadas, pendiente de confirmar
        stops:
          - place_id: rjukandifoss
            order: 1
            duration_min: 20
            planning_status: optional
            visit_status: visited
            variant_note: "Cascada a pie de carretera, muy fácil de ver. Después de tantas cascadas de la ruta, nos sorprendió gratamente."
          - place_id: studlagil
            order: 2
            duration_min: 100
            planning_status: required
            visit_status: visited
            variant_note: "Nos gustó mucho. El agua no estaba verde el día que fuimos — verla así es más suerte que otra cosa — pero las formaciones rocosas por la erosión del agua merecen la pena igual. Es un spot de 10 en Islandia."
          - place_id: dettifoss_selfoss
            order: 3
            duration_min: 90
            planning_status: required
            visit_status: visited
            variant_note: "Nos pilló una nevada fuerte justo al llegar: los copos caían con tanta fuerza que llegaban a hacer daño, no fue agradable, y no pudimos ver bien la cascada por lo nublado. Mala suerte de tiempo, no del lugar — volveremos a intentarlo. Creemos que el lado oeste es mejor, pero si tienes tiempo, merece la pena ver los dos lados."
          - place_id: grjotagja
            order: 4
            duration_min: 20
            planning_status: optional
            visit_status: visited
            variant_note: "Estaba lleno de gente y, para nosotros, no mereció mucho la pena — quizás interesa más a quien sea fan de Juego de Tronos (aquí se rodó una escena de la serie), poco más."
          - place_id: hengifoss
            order: 5
            duration_min: 150
            planning_status: optional
            visit_status: not_visited
        food:
          - name: "Fish and Chips Lake Mývatn"
            area: Mývatn
            price_level: medio
            notes: "3.500 ISK por persona en 2025. El mejor fish and chips de Islandia — y de los mejores que hemos probado nunca. Lo recomendamos sin dudarlo."
            verified_at: 2025-09-18
        our_take: "Stuðlagil desde el lado este no cruza el río: cómodo, pero las fotos más espectaculares se ven desde el otro lado."

      - day: 9
        title: "Mývatn y Krafla"
        summary: "Día dedicado a la zona volcánica y geotérmica de Mývatn y Krafla."
        overnight: camp_systragil
        # duraciones estimadas, pendiente de confirmar
        stops:
          - place_id: krafla_viti
            order: 1
            duration_min: 60
            planning_status: required
            visit_status: visited
            variant_note: "Hizo tanto viento y frío que la verdad no mereció mucho la pena: estuvimos solo unos minutos fuera porque era imposible aguantar más. El entorno nevado fue épico, pero si volviéramos no iríamos de nuevo, y menos por lo que costaba el parking en 2025."
            experience:
              visited_at: "2025-09"
              actual_price_paid:
                amount: 800
                currency: ISK
                notes: "El parking subió a 1.200 ISK después de nuestro viaje."
          - place_id: hverir_namafjall
            order: 2
            duration_min: 45
            planning_status: required
            visit_status: visited
            variant_note: "Toda la zona es un recorrido bastante largo con fumarolas, parece de otro planeta, como estar en Marte — es increíble. Lo que nos parece es que el precio del parking y el baño es abusivo."
          - place_id: hverfjall
            order: 3
            duration_min: 30
            planning_status: optional
            visit_status: visited
            variant_note: "Solo hicimos la subida para verlo: 1,5 km entre ida y vuelta, unos 15 minutos, bastante empinada, pero el cráter es muy guapo y las vistas espectaculares."
          - place_id: dimmuborgir
            order: 4
            duration_min: 60
            planning_status: required
            visit_status: visited
            variant_note: "Hay varios senderos; hicimos el más largo, recorriendo casi toda la zona. Las formaciones de lava son curiosas, el paseo es muy agradable y lo recomendamos mucho — con niños les encantará."
          - place_id: myvatn_viewpoint
            order: 5
            duration_min: 20
            planning_status: optional
            visit_status: visited
            variant_note: "Un spot bonito para disfrutar del lago con tranquilidad y hacer buenas fotos."
          - place_id: leirhnjukur
            order: 6
            duration_min: 45
            planning_status: optional
            visit_status: not_visited
          - place_id: skutustadagigar
            order: 7
            duration_min: 30
            planning_status: optional
            visit_status: not_visited
          - place_id: jardgangalaug
            order: 8
            duration_min: 40
            planning_status: optional
            visit_status: visited
            variant_note: "Nos bañamos junto a la cascada, donde el agua está más fresca que río arriba pero aun así calentita — estábamos a 0°C fuera y el contraste fue único. Solo se bañó uno de nosotros. Lo hicimos justo antes de dormir, de camino al camping Systragil."
        our_take: "Hverir huele mal por el azufre pero es de los paisajes más marcianos del viaje. Merece la pena aunque sea rápido."

      - day: 10
        title: "Goðafoss, Akureyri y la costa de Tröllaskagi"
        summary: "De la zona de Mývatn a la costa norte, con parada para avistamiento de ballenas y cruce por túneles hacia Siglufjörður."
        overnight: camp_lambeyri
        # duraciones estimadas, pendiente de confirmar
        stops:
          - place_id: godafoss
            order: 1
            duration_min: 40
            planning_status: required
            visit_status: visited
          - place_id: akureyri
            order: 2
            duration_min: 60
            planning_status: required
            visit_status: visited
            variant_note: "Visitamos las zonas principales, la iglesia y el jardín botánico — una ciudad con mucho encanto. Aprovechamos para arreglar la calefacción del habitáculo delantero en un taller de la ciudad: un 10."
          - place_id: hauganes
            order: 3
            duration_min: 180
            planning_status: required
            visit_status: visited
            variant_note: "Espectacular: la primera vez que vimos ballenas y nos encantó. Fue respetuoso, vimos un montón, el capitán genial explicando todo el rato. Fuimos de los primeros ese día y repartieron café o chocolate con galletas de canela. Una experiencia preciosa."
          - place_id: migandifoss
            order: 4
            duration_min: 30
            planning_status: required
            visit_status: visited
          - place_id: siglufjordur
            order: 5
            duration_min: 15
            planning_status: required
            visit_status: visited
            variant_note: "No bajamos al pueblo: estábamos cansados y queríamos seguir hasta el camping, así que lo vimos a través del coche. Parece un pueblo pesquero bonito, pero no lo recorrimos de verdad."

      - day: 11
        title: "Camino al oeste: iglesias de turba y Kolugljúfur"
        summary: "Cruce de Skagafjörður hacia la península de Snæfellsnes, con paradas en iglesias de turba históricas y el cañón de Kolugljúfur."
        overnight: camp_hellissandur
        # duraciones estimadas, pendiente de confirmar
        stops:
          - place_id: grafarkirkja
            order: 1
            duration_min: 20
            planning_status: required
            visit_status: visited
          - place_id: glaumbaer
            order: 2
            duration_min: 45
            planning_status: required
            visit_status: visited
            variant_note: "Muy chula, aunque cuando llegamos no habían abierto. La vimos toda por fuera, que ya merece la pena, y aprovechamos para hacer fotos."
          - place_id: vidimyrarkirkja
            order: 3
            duration_min: 20
            planning_status: required
            visit_status: visited
          - place_id: kolugljufur
            order: 4
            duration_min: 60
            planning_status: required
            visit_status: visited
            variant_note: "¡Pequeño pero impresionante! Nos alegramos mucho de haber parado aquí durante el viaje. Pasamos alrededor de una hora dando un breve paseo río arriba y río abajo, con vistas espectaculares."
          - place_id: kolgrafarfjordur
            order: 5
            duration_min: 20
            planning_status: required
            visit_status: visited

      - day: 12
        title: "Snæfellsnes: Kirkjufell, Djúpalónssandur y Arnarstapi"
        summary: "Día completo recorriendo la península de Snæfellsnes, de Kirkjufell hasta los acantilados del sur."
        overnight: camp_mosskogar
        # duraciones estimadas, pendiente de confirmar
        stops:
          - place_id: kirkjufell
            order: 1
            duration_min: 45
            planning_status: required
            visit_status: visited
          - place_id: olafsvik
            order: 2
            duration_min: 30
            planning_status: required
            visit_status: visited
            variant_note: "Dimos un paseo tranquilo por el pueblo."
          - place_id: svortuloft
            order: 3
            duration_min: 30
            planning_status: optional
            visit_status: visited
            variant_note: "Nos encantó el faro: mirador espectacular con acantilados y muchas aves."
          - place_id: djupalonssandur
            order: 4
            duration_min: 45
            planning_status: required
            visit_status: visited
            variant_note: "Paseamos por la playa de Dritvik y Djúpalónssandur."
          - place_id: londrangar
            order: 5
            duration_min: 30
            planning_status: required
            visit_status: visited
          - place_id: hellnar
            order: 6
            duration_min: 30
            planning_status: required
            visit_status: visited
            variant_note: "Espectacular. Aquí vimos nuestras primeras focas, pequeñitas — nos encantó."
          - place_id: arnarstapi
            order: 7
            duration_min: 45
            planning_status: required
            visit_status: visited
            variant_note: "Una zona muy chula: todo se recorre andando. Los acantilados están genial y el puente de piedra (Gatklettur) es una pasada. Muy recomendable."
          - place_id: raudfeldsgja
            order: 8
            duration_min: 30
            planning_status: required
            visit_status: visited
            variant_note: "Nos gustó mucho. La entrada hacia el interior de la montaña es muy fotogénica, con una pequeña cascada dentro, pero no pudimos ascender a través de ella."
          - place_id: budakirkja
            order: 9
            duration_min: 20
            planning_status: required
            visit_status: visited
          - place_id: ytri_tunga
            order: 10
            duration_min: 45
            planning_status: optional
            visit_status: visited
            variant_note: "Lo bonito de aquí es la playa: uno de los sitios para ver focas de cerca, respetuosamente y sin molestarlas. Vimos muchas, fue mágico. Comimos en las mesas de picnic de la playa."
          - place_id: landbrotalaug
            order: 11
            duration_min: 15
            planning_status: optional
            visit_status: visited
            variant_note: "Fuimos, pero estaba lleno de gente y el agua cubría poco. No nos metimos — no mereció la pena la parada."
          - place_id: raudhals
            order: 12
            duration_min: 20
            planning_status: optional
            visit_status: visited
            variant_note: "Llegar aquí fue como estar en otro planeta, muy espectacular y poco conocido."

      - day: 13
        title: "Regreso a Reikiavik"
        summary: "Última etapa de la Ring Road, cierre del círculo en la capital."
        # duración estimada, pendiente de confirmar
        stops:
          - place_id: glymur
            order: 1
            duration_min: 150
            planning_status: optional
            visit_status: not_visited
            skip_reason: "La subida a Glymur es una excursión de 2 a 3 horas ida y vuelta. Es una de las cascadas más altas de Islandia, pero el último día, con el vuelo de vuelta cerca y el camper que entregar, no quisimos arriesgarnos a ir con prisa. Si tienes la mañana libre y buen tiempo, merece la pena; si es tu día de cierre, mejor dejarla."
          - place_id: reykjavik
            order: 2
            duration_min: 90
            planning_status: required
            visit_status: visited
        our_take: "Después de este día no hicimos nada más: nos levantamos más tarde para descansar y fuimos directos a entregar la camper y dejarla limpia."

accommodation:
  notes: "En camper, el alojamiento son campings. Se elige según la posición al final de cada jornada."
  zones:
    - name: "Sur de Islandia"
      description: "Campings más completos y mejor infraestructura."
      pros: ["Duchas incluidas en muchos", "Bien ubicados cerca de los atractivos"]
      cons: ["Más llenos en temporada alta"]
      best_for: [couple, friends]
      picks:
        - place_id: camp_thingvellir
          price_paid: { amount: 4400, currency: ISK, verified_at: 2025-09-13 }
          opinion: "Cómodo para la primera noche: baño y ducha incluidos, y el Círculo Dorado empieza en la puerta."
        - place_id: camp_arnes
          price_paid: { amount: 4400, currency: ISK, verified_at: 2025-09-14 }
          opinion: "El peor camping del viaje: amplio pero sucio y sin sala común."
          notes: "Encontramos ropa interior tirada en el suelo. De las dos duchas, una estaba averiada. Los baños eran lo mejor, limpios."
        - place_id: camp_skogafoss
          price_paid: { amount: 4000, currency: ISK, verified_at: 2025-09-15 }
          opinion: "Dormir al pie de la cascada compensa pagar la ducha."
          notes: "Encontramos los baños y las duchas recién limpios al llegar y pudimos ducharnos los dos a la vez."
        - place_id: camp_svinafell
          price_paid: { amount: 5000, currency: ISK, verified_at: 2025-09-16 }
          opinion: "Muy amplio y completo. Lo recomendamos sin dudarlo."
          notes: "La lavandería estaba rota el día que fuimos."
        - place_id: camp_skaftafell
          price_paid: { amount: 5500, currency: ISK, verified_at: 2025-09-17 }
          opinion: "De los más caros del viaje, pero la ubicación lo vale."
          notes: "Muy concurrido: conviene llegar temprano, pueden faltar baños y duchas para la cantidad de gente."
    - name: "Norte de Islandia"
      description: "Campings más pequeños y tranquilos."
      pros: ["Menos gente", "Más baratos"]
      cons: ["Duchas no siempre incluidas"]
      best_for: [couple, friends]
      picks:
        - place_id: camp_laugar
          price_paid: { amount: 4800, currency: ISK, verified_at: 2025-09-20 }
          opinion: "Por el precio, merece muchísimo la pena: como un polideportivo bien adaptado."
          notes: "Fue nuestra alternativa cuando el Camping Mývatn estaba cerrado. Si llueve, cuidado dónde aparcas la camper por el barro. Lo recomendamos sin dudarlo."
        - place_id: camp_systragil
          price_paid: { amount: 4200, currency: ISK, verified_at: 2025-09-21 }
          opinion: "Pequeño pero precioso, enclavado en la montaña. Lo recomendamos sin dudarlo."
          notes: "Nos nevó por la noche y nos despertamos con todo blanco, fue mágico. Adaptado para familias."
        - place_id: camp_lambeyri
          price_paid: { amount: 5500, currency: ISK, verified_at: 2025-09-22 }
          opinion: "Junto a un río, tranquilo y mágico: de los mejores campings del viaje."
          notes: "No usamos la piscina. Lo recomendamos sin dudarlo."
    - name: "Snæfellsnes (oeste)"
      description: "Campings sencillos al cierre de la ruta, junto a los puntos clave de la península."
      pros: ["Bien situados para Kirkjufell y los acantilados del sur de la península"]
      cons: ["Oferta más limitada que en el sur"]
      best_for: [couple, friends]
      picks:
        - place_id: camp_hellissandur
          price_paid: { amount: 4000, currency: ISK, verified_at: 2025-09-23 }
          opinion: "De los más baratos del viaje y en pleno campo de lava. Lo recomendamos sin dudarlo."
          notes: "Muy concurrido, con gente empezando y terminando la ruta de Snæfellsjökull: conviene ir temprano."
        - place_id: camp_mosskogar
          price_paid: { amount: 5000, currency: ISK, verified_at: 2025-09-24 }
          opinion: "Muy cuco y bien organizado; por su precio y lo que ofrece, lo recomendamos sin dudarlo."
          notes: "El único camping del viaje que solo acepta efectivo: hay que llevar coronas encima. Tiene un sistema estupendo de productos que deja la gente que termina su viaje, disponibles para quien lo empieza. John, el dueño, muy amable y risueño."

transport:
  arrival:
    - from_airport: MAD
      description: "Vuelo a Reikiavik (KEF). El camper se recoge en el aeropuerto o en la ciudad. El aeropuerto está a 50 km de Reikiavik."
      notes: "Llegamos a la 1:30 de la madrugada, recogimos la camper y dormimos directamente en un parking entre los supermercados Bonus y Kronan, en Reikiavik (63.97318428783835, -22.5445651829879)."
      verified_at: 2025-09-11
  local:
    - mode: "Camper"
      description: "Ring Road (Ruta 1) rodea toda la isla, asfaltada. Velocidad máx. 90 km/h en carretera, 30 km/h en pistas de grava. F-roads (pistas del interior): prohibidas para campers estándar."
      notes: "App Gas Map Iceland para encontrar gasolineras baratas. Llenar siempre al pasar por una ciudad."
      verified_at: 2025-09-15

booking_checklist:
  - label: "Alquiler del camper"
    when: "3-6 meses antes"
    priority: alta
    notes: "Los buenos campers se agotan meses antes del verano."
  - label: "Trekking en el glaciar"
    when: "1-2 meses antes"
    priority: alta
    notes: "Las plazas se agotan en temporada alta. Es la excursión más cara del viaje y la más impresionante — no dejarla para el último momento."
  - label: "Seguro de viaje"
    when: "Antes de salir"
    priority: media

# "Nuestro criterio" (1.12 §13). Borrador pendiente de revisión del autor.
how_we_choose:
  - "Tiempo real, no tiempo de Google Maps: a cada parada le dimos lo que necesita, no lo que cabe en el plan."
  - "Desvío frente a recompensa: si un sitio exigía más de una hora de ida y vuelta fuera de la Ring Road, tenía que compensar de verdad."
  - "Sin F-roads: con una camper normal, el interior queda fuera, y preferimos no fingir que no."
  - "La época manda: en septiembre hay menos luz y puede nevar, así que no apretamos los días del norte."
  - "Mejor una parada bien vivida que tres con prisa: por eso dejamos fuera cosas que estaban en el plan."

route_decisions:
  - decision: "Sin Fiordos del Oeste"
    reason: "Son dos o tres días más de carretera; en 13 días no cabían sin quitar tiempo al resto."
  - decision: "Sin Highlands ni Landmannalaugar"
    reason: "Solo se llega por F-roads, prohibidas para una camper sin 4x4."
  - decision: "Mantuvimos el trekking en el glaciar aunque era lo más caro del viaje"
    reason: "502 € entre los dos, y fue lo más impresionante: es lo último que recortaríamos."
  - decision: "Ruta antihoraria, sur primero"
    reason: "El sur tiene lo más impactante para empezar y el norte, con menos gente, para terminar."

pitfalls:
  - "No entrar en F-roads: el GPS de la empresa lo detecta y la penalización puede ser mayor que el deducible del seguro."
  - "Llenar gasolina siempre al pasar por una ciudad. Los tramos remotos pueden tener 150 km sin gasolinera."
  - "Las puertas del camper pueden dañarse con el viento. Posicionar siempre el vehículo como escudo antes de abrir."
  - "En septiembre nos nevó varias noches y llegamos a estar a 0 °C: los campings sin ducha caliente ni sala común se hacen muy duros con ese frío."
  - "Si la nevera de la camper funciona con la batería del vehículo sin estar enchufada a electricidad, apagarla por la noche: dejarla encendida puede agotar la batería y dejar la camper sin arrancar a la mañana siguiente."
  - "La calefacción del habitáculo delantero puede averiarse; si pasa en pleno temporal de nieve o lluvia, puede dejarte mojado y sin calor de golpe. Llevar ropa de abrigo de repuesto a mano."
  - "Casi todo en Islandia se paga con tarjeta, pero algún camping aislado puede pedir solo efectivo. Llevar algunas coronas encima por si acaso."

terrain_tips:
  - "App Vedur (tiempo oficial islandés): el tiempo cambia en minutos."
  - "App Gas Map Iceland para gasolineras más baratas."
  - "Diamond Beach y Jökulsárlón están separadas por la Ring Road: son dos sitios distintos, cruzar con cuidado."
  - "Gljúfrafoss está a 500 metros de Seljalandsfoss, poca gente llega."

practical:
  documents:
    - "DNI o pasaporte (Islandia es espacio Schengen)"
    - "Carnet de conducir (el español es válido)"
    - "Tarjeta de crédito con margen para fianza del camper (puede ser 1.000-2.000 €)"
  plugs: "Tipo F (igual que España). Sin adaptador."
  apps:
    - "Vedur (tiempo oficial)"
    - "Gas Map Iceland (gasolineras baratas)"
    - "Maps.me (offline: imprescindible sin cobertura)"
    - "Safe Travel Iceland (alertas de seguridad vial)"
  tips:
    - "Cocinar en el camper es lo que hace viable el presupuesto. Comer fuera en Islandia puede ser 3-4 veces más caro que en España."
    - "Se puede rellenar la botella de agua gratis en casi cualquier parking, gasolinera o restaurante — el agua del grifo es potable en toda Islandia."

faq:
  - q: "¿Cuánto cuesta viajar a Islandia en camper 13 días?"
    a: "Depende del año y de los precios, así que el total y el precio por persona exactos están en la sección de presupuesto de esta guía, con el desglose completo: vuelos, camper, gasolina, campings, excursiones, supermercado y seguro. Son datos reales de nuestro viaje de 2025, en pareja."
    schema: true
  - q: "¿Qué ruta es mejor, horaria o antihoraria?"
    a: "Nosotros hicimos la antihoraria (sur primero) y nos gustó: el sur tiene los atractivos más impactantes como aperitivo. El norte tiene menos turistas para el final."
    schema: true
  - q: "¿Hace falta 4x4 para la Ring Road?"
    a: "No. La Ring Road está asfaltada y se hace sin problema con un camper estándar. El 4x4 solo es necesario para las F-roads, prohibidas para campers de alquiler estándar."
    schema: true

adaptation_notes:
  - id: parents_road_conditions
    conditions:
      group_type: [parents]
    text: "Para viajar con personas mayores en camper por Islandia conviene reducir los días más largos de conducción (el norte tiene etapas de 300-400 km) partiéndolos en dos. Los campings con mejor infraestructura (duchas, aseos) son especialmente importantes."
    target: both
    priority: 1
  - id: budget_ajustado_camper
    conditions:
      budget: [ajustado]
    text: "Para reducir el presupuesto: cocinar en el camper casi siempre (ahorro estimado 40-70 €/persona), comprar exclusivamente en Bonus, elegir campings sin ducha cuando no sea imprescindible."
    target: both
    priority: 1
