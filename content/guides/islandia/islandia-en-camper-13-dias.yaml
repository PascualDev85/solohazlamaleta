variants:
  - id: intensivo
    name: "Ruta completa (como la hicimos)"
    description: "Los 13 días tal como los planificamos. Días de hasta 340 km con muchas paradas. Hay que madrugar."
    days:
      - day: 1
        title: "Llegada y paseo por Reikiavik"
        summary: "Llegada de madrugada, noche corta en un parking de la ciudad, y primer día paseando por Reikiavik antes de salir hacia el Círculo Dorado, con parada en Þórufoss."
        # duraciones estimadas, pendiente de confirmar
        stops:
          - place_id: reykjavik
            order: 1
            duration_min: 120
            planning_status: required
            visit_status: visited
            variant_note: "Paseamos por Laugavegur, Höfði, el Sun Voyager, Þúfa y el estanque de Tjörnin."
          - place_id: thorufoss
            order: 2
            duration_min: 40
            planning_status: optional
            visit_status: visited
            variant_note: "Comimos en este entorno — fue la primera cascada del viaje y flipamos con el paisaje."
        our_take: "Llegamos a la 1:30 de la madrugada y dormimos pocas horas en un parking de la ciudad antes de arrancar el día. Aun con poco sueño, mereció la pena hacer Reikiavik con calma este primer día en vez de dejarlo para el regreso."

      - day: 2
        title: "Círculo Dorado"
        summary: "Þingvellir, Géiser y Gullfoss. El trío clásico para entrar en calor."
        photo:
          src: islandia/islandia-gullfoss.jpg
          alt: "Cascada de Gullfoss en dos saltos, con nubes oscuras y gente en el mirador de la izquierda"
          caption: "Gullfoss, septiembre de 2025"
        highlight: "Acabar en el río termal de Reykjadalur, dándonos un baño y relajándonos en su entorno."
        drive:
          km: 275
          minutes: 225
        overnight: "Camping Árnes"
        physical_level:
          hills: some
        stops:
          - place_id: thingvellir
            order: 1
            duration_min: 70
            planning_status: required
            visit_status: visited
            start_time: "09:00"
            travel_to_next_min: 50
            travel_to_next_mode: "coche"
            variant_note: "Parking P3, paseo por la grieta y el lago, sin perder tiempo."
          - place_id: geysir
            order: 2
            duration_min: 50
            planning_status: required
            visit_status: visited
            start_time: "10:40"
            travel_to_next_min: 10
            travel_to_next_mode: "coche"
          - place_id: gullfoss
            order: 3
            duration_min: 60
            planning_status: required
            visit_status: visited
            start_time: "11:40"
          - place_id: reykjadalur
            order: 4
            duration_min: 180
            planning_status: optional
            visit_status: visited
            variant_note: "Dicen que la subida son hasta 1h30, pero a nosotros nos costó unos 45 minutos. Nos bañamos entre 1 y 1h30 en un tramo que sentimos casi como una piscina para nosotros solos — la sensación fue increíble. Lo único malo: al salir del agua pasamos mucho frío mientras nos vestíamos."
        our_take: "Si tuviéramos que quitar algo del Círculo Dorado, quitaríamos Þingvellir el primer día y lo dejaríamos para el último, con más calma. El Géiser y Gullfoss son más impactantes como primera impresión. Cambiamos Kerið por subir a Reykjadalur a bañarnos en el río termal al final del día: no nos arrepentimos, mereció la pena el cambio."
        plan_b: "Si llueve: Gullfoss desde el mirador cubierto sigue mereciendo. El Géiser no depende del tiempo."

      - day: 3
        title: "Háifoss, cañones del sur y llegada a Skógafoss"
        summary: "De Þjórsárdalur hacia el sur, con paradas en cañones y rincones poco conocidos antes de Seljalandsfoss; parada rápida en Skógafoss al llegar al camping, de camino. La visita completa es a la mañana siguiente."
        # duraciones estimadas, pendiente de confirmar
        physical_level:
          hills: none
        stops:
          - place_id: hjalparfoss
            order: 1
            duration_min: 20
            planning_status: optional
            visit_status: visited
          - place_id: haifoss
            order: 2
            duration_min: 30
            planning_status: optional
            visit_status: visited
            variant_note: "Teníamos muchas expectativas por las fotos, pero nos tocó un viento muy fuerte ese día y no pudimos disfrutarla con calma. Vimos el mirador; la ruta de descenso hasta la base no la hicimos por tiempo."
          - place_id: nauthusagil
            order: 3
            duration_min: 45
            planning_status: optional
            visit_status: visited
          - place_id: dc3_eyvindarholt
            order: 4
            duration_min: 40
            planning_status: optional
            visit_status: visited
            variant_note: "No conocíamos el pecio famoso de Sólheimasandur, pero este nos gustó bastante. Lo único negativo es que hay que pagar el parking; aun así nos pareció que merecía la pena verlo."
          - place_id: seljalandsfoss
            order: 5
            duration_min: 45
            planning_status: required
            visit_status: visited
          - place_id: gljufrafoss
            order: 6
            duration_min: 30
            planning_status: optional
            visit_status: visited
          - place_id: skogafoss
            order: 7
            duration_min: 15
            planning_status: required
            visit_status: visited
            start_time: "18:30"
            variant_note: "Vista rápida al llegar al camping de al lado, de camino y sin subir al mirador — la visita con calma es a la mañana siguiente."
        our_take: "Seljalandsfoss se puede hacer con calma por la mañana. Dormir junto a Skógafoss deja la cascada lista para volver temprano, con luz y sin gente."
        plan_b: "La lluvia mejora estas cascadas (más caudal). No es mal plan si llueve."

      - day: 4
        title: "Mañana tranquila en Skógafoss"
        summary: "Vuelta a Skógafoss por la mañana, sin las multitudes del mediodía, para subir al mirador con calma."
        physical_level:
          hills: some
        stops:
          - place_id: skogafoss
            order: 1
            duration_min: 60
            planning_status: required
            visit_status: visited
            start_time: "08:30"
            variant_note: "Subir las escaleras de la derecha para el mirador superior. Con la luz de la mañana y sin las multitudes del mediodía."
        our_take: "Dormir justo al lado y volver a primera hora es la diferencia entre ver la cascada en foto de postal o entre autobuses de turistas."

      - day: 5
        title: "Trekking en el glaciar"
        summary: "Día centrado en el trekking guiado sobre el glaciar Svínafellsjökull, con Svartifoss de propina antes de instalarse en el camping."
        # duraciones estimadas, pendiente de confirmar
        stops:
          - place_id: trekking_glaciar_svinafellsjokull
            order: 1
            duration_min: 360
            planning_status: required
            visit_status: visited
            variant_note: "Excursión de 6 horas y dificultad moderada, con la base de operaciones muy bien situada, tranquila y rodeada de naturaleza, cerca del parque de Skaftafell. No nos tocó un día espectacular de tiempo, pero la experiencia de caminar sobre el glaciar fue impresionante igualmente. Por el precio, merece muchísimo la pena."
          - place_id: hundafoss
            order: 2
            duration_min: 10
            planning_status: optional
            visit_status: visited
          - place_id: svartifoss
            order: 3
            duration_min: 90
            planning_status: required
            visit_status: visited
          - place_id: svinafellsjokull
            order: 4
            duration_min: 20
            planning_status: optional
            visit_status: not_visited
            variant_note: "Se ve desde el aparcamiento sin necesidad de hacer la excursión guiada. Queda fuera del itinerario si el trekking ocupa toda la tarde."
            skip_reason: "Ese mismo día habíamos hecho el trekking guiado sobre el glaciar, así que acercarnos al mirador de Svínafellsjökull habría sido repetir paisaje. Si no haces una excursión de glaciar, este mirador es una forma fácil y gratuita de ver una lengua glaciar de cerca; para nosotros, después del trekking, sobraba."
        our_take: "El trekking en el glaciar es la excursión más cara del viaje (502 € entre los dos) y la más impresionante. No la recortaríamos."

      - day: 6
        title: "Jökulsárlón, Diamond Beach y Vestrahorn"
        summary: "De Skaftafell a Djúpivogur, con parada en las dos lagunas glaciares y los paisajes del sureste."
        # duraciones estimadas, pendiente de confirmar
        stops:
          - place_id: mulagljufur
            order: 1
            duration_min: 110
            planning_status: optional
            visit_status: visited
            variant_note: "Una de las joyas de Islandia: pudimos disfrutar de todo el recorrido y de los miradores, en plena naturaleza. Nos encantó. Desde el parking al mirador son unos 45 minutos de ida y otros 45 de vuelta."
          - place_id: fjallsarlon
            order: 2
            duration_min: 45
            planning_status: required
            visit_status: visited
          - place_id: jokulsarlon
            order: 3
            duration_min: 90
            planning_status: required
            visit_status: visited
            variant_note: "Diamond Beach es espectacular: llena de trozos de icebergs grandes y pequeños que parecen diamantes. Desde Jökulsárlón salen excursiones en barca para ver de cerca cómo caen los icebergs al mar — no las hicimos, pero es un espectáculo a la vez precioso y un poco triste de ver desde la orilla."
          - place_id: vestrahorn
            order: 4
            duration_min: 60
            planning_status: required
            visit_status: visited
            variant_note: "Para nosotros sí mereció la pena pagar por verlo: el recorrido es bastante amplio y el entorno, con las montañas y el poblado vikingo, es espectacular. Comimos en las mesas cerca del parking y pudimos usar también la zona de baño del camping."
          - place_id: eystrahorn
            order: 5
            duration_min: 30
            planning_status: optional
            visit_status: visited
          - place_id: thjodvegur_renos
            order: 6
            duration_min: 15
            planning_status: optional
            visit_status: not_visited
            variant_note: "Tramo donde suele haber renos, sin garantía de avistamiento."
          - place_id: laekjavik
            order: 7
            duration_min: 20
            planning_status: optional
            visit_status: not_visited
          - place_id: djupavogskorin
            order: 8
            duration_min: 15
            planning_status: optional
            visit_status: not_visited
          - place_id: raudafell
            order: 9
            duration_min: 90
            planning_status: optional
            visit_status: visited
            variant_note: "Después de muchos kilómetros paramos aquí y empezamos a ver auroras boreales: de las mejores del viaje, de montaña a montaña y con todos los colores. Fue tan épico que nos quedamos a dormir en el mirador, y queremos ser claros: en Islandia está prohibido pernoctar en camper fuera de los campings y hay multas. No lo recomendamos. Si las auroras te pillan en ruta, disfrútalas y sigue después hasta el camping más cercano. Quedarse solo es legal con permiso del propietario del terreno, y en ese caso, con respeto absoluto por el entorno y bajo la responsabilidad de cada uno."
        our_take: "Diamond Beach y Jökulsárlón son dos sitios distintos separados por la Ring Road: cruzar con cuidado entre ambos. No vimos ningún reno en el tramo donde suelen estar — no lo contaríamos como parada en sí, es solo un tramo de carretera con posibilidad de avistamiento."

