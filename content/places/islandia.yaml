# --- Day 4, south coast from Skógar to Skaftafell (the author's notes, reviewed 2026-10-08).
# Coordinates from public sources, approximate; parking and maps_url to review with the author.
- place_id: kvernufoss
  name: Kvernufoss
  short_name: Kvernufoss
  destination: islandia
  lat: 63.5289
  lng: -19.4814
  type: monument
  verified_at: 2025-09-15
  description: "Cascada de unos 30 metros escondida en un pequeño cañón junto a Skógar, a poca distancia al este de Skógafoss. El sendero permite pasar por detrás de la cortina de agua."
  notes: "Se aparca en el Museo de Skógar (el autor lo anotó como gratuito) y se sigue un sendero de unos 1,4 km ida y vuelta por detrás del museo, con un tramo junto al arroyo. Coordenadas aproximadas, pendientes de confirmar por el autor antes de publicar."

- place_id: dyrholaey
  name: Dyrhólaey
  short_name: Dyrhólaey
  destination: islandia
  lat: 63.4022
  lng: -19.1288
  type: viewpoint
  verified_at: 2025-09-15
  description: "Promontorio de unos 120 metros sobre el mar al oeste de Vík, con un gran arco de roca natural y un faro en lo alto. Desde arriba se ven la playa de Reynisfjara y los farallones de Reynisdrangar."
  notes: "Se llega por la carretera 218 desde la Ring Road. Hay dos zonas: la parte baja, junto al mar, y la alta, con el faro, a la que se sube por una pista empinada. Coordenadas aproximadas, pendientes de confirmar por el autor antes de publicar."

- place_id: reynisfjara
  name: Playa de Reynisfjara
  short_name: Reynisfjara
  destination: islandia
  lat: 63.4045
  lng: -19.0446
  type: area
  verified_at: 2025-09-15
  description: "Playa de arena negra al pie del monte Reynisfjall, con paredes de columnas de basalto, la cueva Hálsanefshellir y, frente a la orilla, los farallones de Reynisdrangar."
  notes: "Se llega por la carretera 215 desde la Ring Road. Las olas son traicioneras (sneaker waves): no hay que acercarse a la orilla ni dar la espalda al mar, y hay paneles de aviso en la entrada. El mirador de lo alto del Reynisfjall se sube por una pista aparte desde Vík. Coordenadas aproximadas, pendientes de confirmar por el autor antes de publicar."

- place_id: iglesia_vik
