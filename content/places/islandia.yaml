  lng: -18.3150
  type: monument
  verified_at: 2025-09-15
  description: "Cresta de lava junto a la Ring Road, en el arenal de Mýrdalssandur, cubierta de pequeños montones de piedras que levantan los viajeros siguiendo una antigua costumbre."
  notes: "Junto a la carretera, con aparcamiento (el autor lo anotó como gratuito). Parada corta. Coordenadas aproximadas, pendientes de confirmar por el autor antes de publicar."

- place_id: eldhraun
  name: Campo de lava de Eldhraun
  short_name: Eldhraun
  destination: islandia
  lat: 63.7180
  lng: -18.1880
  type: area
  verified_at: 2025-09-15
  description: "Campo de lava cubierto de musgo formado por la erupción de los cráteres de Laki en 1783 y 1784, uno de los mayores flujos de lava de época histórica."
  notes: "Aparcamiento junto a la Ring Road (el autor lo anotó como gratuito). El musgo es frágil y tarda décadas en recuperarse: se mira desde los senderos y las zonas marcadas, sin pisarlo. Coordenadas aproximadas, pendientes de confirmar por el autor antes de publicar."

