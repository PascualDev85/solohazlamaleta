  notes: "Se llega por la carretera 206 desde la Ring Road. Un sendero recorre el borde del cañón con varios miradores. El terreno junto al borde es frágil: se camina solo por los senderos marcados. Coordenadas aproximadas, pendientes de confirmar por el autor antes de publicar."

