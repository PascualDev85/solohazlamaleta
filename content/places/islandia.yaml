  short_name: Vík
  destination: islandia
  lat: 63.4195
  lng: -19.0115
  type: monument
  verified_at: 2025-09-15
  description: "Iglesia de tejado rojo en una colina sobre el pueblo de Vík í Mýrdal, con vistas al mar y a los farallones de Reynisdrangar."
  notes: "Se sube en coche desde el pueblo; el autor anotó el aparcamiento como gratuito. Coordenadas aproximadas, pendientes de confirmar por el autor antes de publicar."

- place_id: gigjagja
  name: Gígjagjá (la "cueva de Yoda")
  short_name: Gígjagjá
  destination: islandia
  lat: 63.416961
  lng: -18.764506
  type: monument
  verified_at: 2025-09-15
  description: "Cueva en la base del cabo Hjörleifshöfði, al este de Vík, cuya abertura recuerda la silueta de Yoda, el personaje de La guerra de las galaxias; de ahí su apodo."
  notes: "Se llega por una pista de grava que sale de la Ring Road y rodea Hjörleifshöfði. Coordenadas aproximadas, pendientes de confirmar por el autor antes de publicar."

- place_id: laufskalavarda
