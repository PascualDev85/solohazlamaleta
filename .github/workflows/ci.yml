name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Types of src/, engine/, schemas/, scripts/ and tests/, .astro files
      # included. Test fixtures typed against the schema fail here when the
      # schema moves and they do not.
      - name: Type check
        run: npm run typecheck

      # A guide that does not satisfy the schema must stop the build.
      # This is the project's content quality gate, not a formality.
      - name: Build
        run: npm run build

      # The fonts are subsets: a character no font covers would fall back to a
      # system font without anyone noticing (scripts/font-coverage.ts).
      - name: Every painted character is in a self-hosted font
        run: npm run fonts:check
      # Gzipped HTML of every page under its cap (scripts/html-size.ts):
      # 43.8 KB, Lighthouse's first TCP windows; 95 KB for the 13-day guide,
      # under the next window at ~102 KB (docs/1.13 §5). Prints what is left.
      - name: HTML size budget
        run: npm run size:check

      - name: Assert an invalid guide fails the build
        run: |
          GUIDE=$(ls src/content/guides/*.json | head -1)
          cp "$GUIDE" /tmp/guide.bak
          node -e "
            const fs = require('fs');
            const path = process.argv[1];
            const guide = JSON.parse(fs.readFileSync(path, 'utf8'));
            const count = String(guide.meta.days[0]);
            guide.variants[count] = [...(guide.variants[count] ?? []), 999];
            fs.writeFileSync(path, JSON.stringify(guide, null, 2));
          " "$GUIDE"

          if npm run build > /tmp/invalid.log 2>&1; then
            cp /tmp/guide.bak "$GUIDE"
            echo "::error::The build succeeded with an invalid guide. The schema is not enforcing."
            exit 1
          fi

          cp /tmp/guide.bak "$GUIDE"
          echo "Schema correctly rejected the invalid guide."

      - name: Rebuild after the negative test
        run: npm run build

      # The site that lighthouse and devices check, built once here.
      # dist/_headers (scripts/write-headers.ts) travels with it: test:ui runs
      # every page under those headers.
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  lighthouse:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Quality gate: every page in `npm run lighthouse` (package.json) must
      # score 100 in performance, accessibility, best practices and SEO, on
      # mobile and on desktop, judged on the median of 3 runs. Draft guides
      # carry noindex on purpose, so only the "is crawlable" audit is skipped
      # for them (see scripts/lighthouse-check.ts).
      - name: Lighthouse 100, mobile and desktop
        run: |
          npx astro preview --port 4321 &
          # Up to 60 s for the preview to answer.
          for _ in $(seq 60); do curl -fs -o /dev/null http://localhost:4321/ && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:4321/
          npm run lighthouse

      # Browser checks of the guide (scripts/ui-check.ts): overlay panels keep
      # their header on top while scrolling, the day cards keep their lines
      # on phones from 350 to 414px wide, every page runs clean under the
      # headers in dist/_headers (Content-Security-Policy included), and the
      # panels work by keyboard.
      - name: UI checks in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui

  # The guide on current iPhones (WebKit, Safari's engine) and Android phones
  # (Chromium), with Playwright's device descriptors (scripts/ui-devices.ts).
  # The screenshots are uploaded even when a check fails, for review by eye.
  devices:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - run: npx playwright install --with-deps webkit chromium

      - name: Device checks, iPhone and Android
        run: |
          npx astro preview --port 4321 &
          # Up to 60 s for the preview to answer.
          for _ in $(seq 60); do curl -fs -o /dev/null http://localhost:4321/ && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:4321/
          npm run test:devices

      - name: Upload device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-devices
          path: ui-devices/
          if-no-files-found: warn
