name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A guide that does not satisfy the schema must stop the build.
      # This is the project's content quality gate, not a formality.
      - name: Build
        run: npm run build

      - name: Assert an invalid guide fails the build
        run: |
          GUIDE=$(ls src/content/guides/*.json | head -1)
          cp "$GUIDE" /tmp/guide.bak
          node -e "
            const fs = require('fs');
            const path = process.argv[1];
            const guide = JSON.parse(fs.readFileSync(path, 'utf8'));
            const count = String(guide.meta.days[0]);
            guide.variants[count] = [...(guide.variants[count] ?? []), 999];
            fs.writeFileSync(path, JSON.stringify(guide, null, 2));
          " "$GUIDE"

          if npm run build > /tmp/invalid.log 2>&1; then
            cp /tmp/guide.bak "$GUIDE"
            echo "::error::The build succeeded with an invalid guide. The schema is not enforcing."
            exit 1
          fi

          cp /tmp/guide.bak "$GUIDE"
          echo "Schema correctly rejected the invalid guide."

      - name: Rebuild after the negative test
        run: npm run build

  lighthouse:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # A draft guide carries noindex by design, which caps its SEO score at
      # 66. Measuring one would report a permanent red that means nothing, so
      # the guide route is measured on a published fixture instead: the
      # template is what we are testing, not the draft flag.
      - name: Build a published fixture of the guide route
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');

            const dir = 'src/content/guides';
            const source = fs.readdirSync(dir).find((f) => f.endsWith('.json'));
            const guide = JSON.parse(fs.readFileSync(path.join(dir, source), 'utf8'));

            guide.meta.draft = false;
            guide.meta.slug = 'ci-lighthouse-fixture';
            if (!guide.meta.tripDone) {
              guide.meta.tripDone = {
                date: '2025-01',
                group: guide.groups[0],
                days: guide.meta.days[0],
                season: 'fixture',
              };
            }

            fs.writeFileSync(
              path.join(dir, 'ci-lighthouse-fixture.json'),
              JSON.stringify(guide, null, 2),
            );

            const dest = guide.meta.destination;
            fs.writeFileSync('/tmp/fixture-url', '/' + dest + '/ci-lighthouse-fixture/');
          "
          npm run build

      - name: Lighthouse on the home page and a guide
        run: |
          npx --yes astro preview --port 4321 &
          npx --yes wait-on http://localhost:4321/ --timeout 60000

          FIXTURE=$(cat /tmp/fixture-url)

          for PAGE in "/" "$FIXTURE"; do
            echo "--- $PAGE ---"
            npx --yes lighthouse "http://localhost:4321$PAGE" \
              --quiet --chrome-flags="--headless --no-sandbox" \
              --output=json --output-path=/tmp/lh.json \
              --only-categories=performance,accessibility,best-practices,seo

            node -e "
              const report = require('/tmp/lh.json');
              const failures = [];

              for (const [name, category] of Object.entries(report.categories)) {
                const score = Math.round(category.score * 100);
                console.log(name.padEnd(16), score);
                if (score < 95) failures.push(name + ': ' + score);
              }

              if (failures.length > 0) {
                console.error('Below the 95 threshold: ' + failures.join(', '));
                process.exit(1);
              }
            "
          done

          rm -f src/content/guides/ci-lighthouse-fixture.json
